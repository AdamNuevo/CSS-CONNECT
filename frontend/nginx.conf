server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # CSV uploads go through here (the API enforces its own 5 MB limit)
  client_max_body_size 6m;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Phone app (student/faculty). Sign-in, token refresh and set-password stay in the main API,
  # which owns the accounts; everything else is served by the app backend on the same database.
  location /api/v1/auth/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /api/v1/ {
    proxy_pass http://app-api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    # the API sends its own security headers (helmet); don't send two copies
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # built assets have hashed names, so they can be cached for a long time
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # React Router: any other path serves the app
  location / {
    try_files $uri /index.html;
  }
}
